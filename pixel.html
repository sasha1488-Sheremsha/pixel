
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="flex-H">

        <div class="flex-H">
            <img draggable="false" src="" alt="">
            <p>PixelForge</p>
        </div>

        <div class="flex-H">
            <a class="log-in" href="">Log in</a>
        </div>

    </header>


    <main class="flex-H pixel-page">
        <section class="tools flex-V">
            <input type="color">
            <div id="draw" ></div>
            <div id="delete" ></div>
            <div id="eraser"></div>
            <div id="save"></div>
            <div id="fill"></div>
            <div id="download"></div>
            <div id="grid"></div>
        </section>
        <section class="grid">

        </section>
    </main>


    <footer></footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
